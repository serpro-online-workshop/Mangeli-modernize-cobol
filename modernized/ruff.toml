target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PT"]
# SIM300 misreads UPPER_CASE module constants on the left of == as Yoda conditions.
ignore = ["SIM300"]

[lint.per-file-ignores]
# Tests use assert and run the trusted local legacy binary via subprocess.
"tests/**" = ["S101", "S603"]
